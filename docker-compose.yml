services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: etss
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    # Host 5433 avoids clashing with a local Postgres on 5432; app still uses db:5432
    ports:
      - '5438:5432'
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U postgres -d etss']
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    ports:
      - '6383:6379'
    volumes:
      - redis_data:/data

  mailhog:
    image: mailhog/mailhog:latest
    platform: linux/amd64
    # Host 1026 avoids macOS/other tools using 1025; app still uses mailhog:1025 on the Docker network
    ports:
      - '1026:1025'
      - '8026:8025'

  app:
    build:
      context: .
      dockerfile: Dockerfile
      target: development
    ports:
      - '3000:3000'
    env_file:
      - .env
    environment:
      NODE_ENV: development
      CHOKIDAR_USEPOLLING: 'true'
      PORT: 3000
      DB_HOST: db
      DB_PORT: 5432
      DB_USERNAME: postgres
      DB_PASSWORD: postgres
      DB_NAME: etss
      DATABASE_URL: postgres://postgres:postgres@db:5432/etss
      REDIS_HOST: redis
      REDIS_PORT: 6379
      SMTP_HOST: mailhog
      SMTP_PORT: 1025
      SMTP_USER: ''
      SMTP_PASS: ''
    volumes:
      - .:/app
      - app_node_modules:/app/node_modules
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_started
      mailhog:
        condition: service_started

volumes:
  postgres_data:
  redis_data:
  app_node_modules:

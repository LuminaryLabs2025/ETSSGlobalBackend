services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: etss
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    # Host 5433 avoids clashing with a local Postgres on 5432; app still uses db:5432
    ports:
      - '5438:5432'
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U postgres -d etss']
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    ports:
      - '6383:6379'
    volumes:
      - redis_data:/data

  app:
    build:
      context: .
      dockerfile: Dockerfile
      target: development
    ports:
      - '3000:3000'
    env_file:
      - .env
    environment:
      NODE_ENV: development
      CHOKIDAR_USEPOLLING: 'true'
      PORT: 3000
      DB_HOST: db
      DB_PORT: 5432
      DB_USERNAME: postgres
      DB_PASSWORD: postgres
      DB_NAME: etss
      DATABASE_URL: postgres://postgres:postgres@db:5432/etss
      REDIS_HOST: redis
      REDIS_PORT: 6379
      # SMTP_* comes from .env (e.g. Resend). Do not hardcode secrets here.
    volumes:
      - .:/app
      - app_node_modules:/app/node_modules
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_started

  # One-off seed job: docker compose --profile seed run --rm seed
  seed:
    profiles: ['seed']
    build:
      context: .
      dockerfile: Dockerfile
      target: development
    env_file:
      - .env
    environment:
      NODE_ENV: development
      DB_HOST: db
      DB_PORT: 5432
      DB_USERNAME: postgres
      DB_PASSWORD: postgres
      DB_NAME: etss
      DATABASE_URL: postgres://postgres:postgres@db:5432/etss
    volumes:
      - .:/app
      - app_node_modules:/app/node_modules
    depends_on:
      db:
        condition: service_healthy
    command: ['npm', 'run', 'seed']

volumes:
  postgres_data:
  redis_data:
  app_node_modules:
